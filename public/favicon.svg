<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444" />
      <stop offset="100%" style="stop-color:#DC2626" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="#0F172A"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#favGradient)" stroke-width="2"/>

  <!-- Speed lines -->
  <g opacity="0.5">
    <line x1="8" y1="32" x2="18" y2="32" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="26" x2="18" y2="26" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="10" y1="38" x2="18" y2="38" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- "S" for Speedway -->
  <text x="32" y="27"
        font-family="Arial Black, sans-serif"
        font-size="22"
        font-weight="900"
        fill="url(#favGradient)"
        text-anchor="middle">S</text>

  <!-- "H" for Hub -->
  <text x="32" y="46"
        font-family="Arial Black, sans-serif"
        font-size="20"
        font-weight="900"
        fill="#E2E8F0"
        text-anchor="middle">H</text>

  <!-- Small NZ indicator -->
  <circle cx="50" cy="14" r="6" fill="#DC2626"/>
  <text x="50" y="17"
        font-family="Arial, sans-serif"
        font-size="6"
        font-weight="bold"
        fill="#0F172A"
        text-anchor="middle">NZ</text>
</svg>
